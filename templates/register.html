<!DOCTYPE html>

<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - FisAI</title>


<link rel="stylesheet" href="/static/css/style.css">


</head>
<body>

<div class="split-auth">


<div class="auth-left">

    <div class="brand-box">

        <h1>📊 FisAI</h1>

        <h2>
            Harcamalarınızı
            Kontrol Altına Alın
        </h2>

        <p>
            Fişlerinizi yükleyin, harcamalarınızı analiz edin,
            bütçenizi daha akıllı yönetin.
        </p>

    </div>

</div>

<div class="auth-right">

    <div class="login-card">

        <h2>Hesap Oluştur 🚀</h2>

        <p>
            Birkaç saniyede ücretsiz hesabınızı oluşturun.
        </p>

        <form action="/login" method="GET">

            <input
                type="text"
                placeholder="Ad Soyad"
                required
            >

            <input
                type="email"
                placeholder="E-posta adresiniz"
                required
            >

            <input
                type="password"
                placeholder="Şifreniz"
                required
            >

            <button
                type="submit"
                class="auth-btn"
            >
                Kayıt Ol
            </button>

        </form>

        <div class="auth-footer">

            Zaten hesabın var mı?

            <a href="/login">
                Giriş Yap
            </a>

        </div>

    </div>

</div>

</div>

</body>
</html>
