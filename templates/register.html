<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Fiş Geçmişi</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="container">

    <h2>📋 Fiş Geçmişi</h2>

    <div style="margin-bottom:25px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">

        <a href="/dashboard" class="btn">
            📊 Panele Dön
        </a>

        <a
            href="/delete_all"
            class="btn logout-btn"
            onclick="return confirm('Tüm fiş geçmişini silmek istediğinize emin misiniz?')"
        >
            🗑️ Tüm Geçmişi Temizle
        </a>

    </div>

    <div class="receipt-list">

        {% for fis in fisler %}

        <div class="receipt-card">

            <div class="receipt-header">
                <h3>{{ fis[4] }}</h3>
                <span>#{{ fis[0] }}</span>
            </div>

            <p>📅 Tarih: {{ fis[1] }}</p>
            <p>🛒 Kategori: {{ fis[3] }}</p>
            <p>💰 Toplam: {{ fis[2] }} TL</p>

            <br>

            <a
                href="/delete/{{ fis[0] }}"
                class="btn logout-btn"
                onclick="return confirm('Bu fişi silmek istediğinize emin misiniz?')"
            >
                🗑️ Bu Fişi Sil
            </a>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
