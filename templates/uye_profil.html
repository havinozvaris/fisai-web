<div class="layout">

   
    <div class="sidebar">

        <div class="logo">
            📊 FisAI
        </div>

        <div class="menu">
            <a href="/dashboard">📊 Anasayfa</a>
            <a href="/receipts">📜 Fiş Geçmişi</a>
            <a href="/reports">📈 Raporlar</a>
            <a href="/uye_profil" class="active">👤 Profil</a>
            <a href="/logout">🚪 Çıkış</a>
        </div>

    </div>

    <!-- İçerik -->
    <div class="content">

        <div class="profile-card">

    <div class="avatar">
       {{ user.name[:1] }}
    </div>

    <h2>{{ user.name }}</h2>
    <p class="mail">{{ user.email }}</p>

    <form method="POST" action="{{ url_for('profil_guncelle') }}">

        <h3>👤 Bilgilerimi Güncelle</h3>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            placeholder="E-posta"
            required>

        <button class="btn" type="submit">
            Bilgileri Güncelle
        </button>

    </form>

    <form method="POST" action="{{ url_for('sifre_degistir') }}">

        <h3>🔒 Şifre Değiştir</h3>

        <input
            type="password"
            name="old_password"
            placeholder="Eski Şifre"
            required>

        <input
            type="password"
            name="new_password"
            placeholder="Yeni Şifre"
            required>

        <button class="btn" type="submit">
            Şifreyi Güncelle
        </button>

    </form>

</div>

    </div>

</div>
