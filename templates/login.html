<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - FisAI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="split-auth">

    <div class="auth-left">
        <div class="brand-box">
            <h1>📊 FisAI</h1>

            <h2>
                Harcamalarınızı
                Yapay Zeka ile
                Yönetin
            </h2>

            <p>
                Fişlerinizi yükleyin,
                kategorileri otomatik çıkarın,
                harcamalarınızı analiz edin.
            </p>
        </div>
    </div>

    <div class="auth-right">
        <div class="login-card">

            <h2>Tekrar Hoş Geldin 👋</h2>

            <p>
                Hesabına giriş yaparak analizlerine devam et.
            </p>

            {% if hata %}
                <div class="error-message">
                    {{ hata }}
                </div>
            {% endif %}

            <form action="/login" method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="E-posta adresiniz"
                    required
                >

                <input
                    type="password"
                    name="sifre"
                    placeholder="Şifreniz"
                    required
                >

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Giriş Yap
                </button>

            </form>

            <div class="auth-footer">
                Hesabın yok mu?

                <a href="/register">
                    Kayıt Ol
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
